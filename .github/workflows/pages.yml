# Publishes the web demo to GitHub Pages: web/ plus the Python package,
# which the page runs in the browser through Pyodide when no server answers.
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/py/interactive_graph
          cp -r web/* _site/
          cp interactive_graph/*.py _site/py/interactive_graph/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
